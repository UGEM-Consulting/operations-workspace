# Optional blueprint. Applying this creates resources; review before use.
services:
  - type: web
    name: operations-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build --workspace=@operations/api
    startCommand: npm run start:render --workspace=@operations/api
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: operations-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BFF_SHARED_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: DEPLOYMENT_PURPOSE
        value: production
      # Applicant verification email (Google Workspace SMTP). Enter EMAIL_DELIVERY=smtp in the dashboard only
      # after SMTP_USER, SMTP_PASSWORD and EMAIL_FROM are set; until then verification fails closed (503)
      # while the API still starts. Secrets are never stored in this file.
      - key: EMAIL_DELIVERY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Applicant photos and signed documents: a private Google Cloud Storage bucket. The production API refuses
      # to start without these; set them before deploying. GCS_CREDENTIALS_BASE64 is a secret.
      - key: STORAGE_DRIVER
        value: gcs
      - key: GCS_BUCKET
        sync: false
      - key: GCS_CREDENTIALS_BASE64
        sync: false
databases:
  - name: operations-postgres
    plan: basic-256mb
    databaseName: operations
    user: operations
    ipAllowList: []
