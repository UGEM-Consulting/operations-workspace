# Optional blueprint. Applying this creates resources; review before use.
services:
  - type: web
    name: operations-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build --workspace=@operations/api
    startCommand: npm run start:render --workspace=@operations/api
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: operations-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BFF_SHARED_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "28800"
databases:
  - name: operations-postgres
    plan: basic-256mb
    databaseName: operations
    user: operations
    ipAllowList: []
