services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations
      POSTGRES_DB: operations
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
